<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Estados y Municipios</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .spinner-border {
            display: none; 
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0 text-center">Selector de Estados y Municipios</h1>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="id_estado" class="form-label"><b>Estado:</b></label>
                            <select id="id_estado" name="estado" class="form-select form-select-lg">
                                <option selected disabled value="">Selecciona un estado...</option>
                                {% for estado in estados %}
                                    <option value="{{ estado.id }}">{{ estado.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="id_municipio" class="form-label"><b>Municipio:</b></label>
                            <div class="d-flex align-items-center">
                                <select id="id_municipio" name="municipio" class="form-select form-select-lg" disabled>
                                    <option value="">-- Esperando un estado --</option>
                                </select>
                                <div id="loading-spinner" class="spinner-border text-primary ms-3" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        const estadoSelect = document.getElementById('id_estado');
        const municipioSelect = document.getElementById('id_municipio');
        const spinner = document.getElementById('loading-spinner');

        estadoSelect.addEventListener('change', function() {
            const estadoId = this.value;
            const url = `/ajax/cargar-municipios/?estado_id=${estadoId}`;

            municipioSelect.innerHTML = '<option value="">Cargando...</option>';
            municipioSelect.disabled = true;
            
            spinner.style.display = 'inline-block';

            if (!estadoId) {
                municipioSelect.innerHTML = '<option value="">-- Esperando un estado --</option>';
                spinner.style.display = 'none'; 
                return;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    municipioSelect.innerHTML = '<option selected disabled value="">Selecciona un municipio</option>';
                    
                    data.forEach(function(municipio) {
                        const option = document.createElement('option');
                        option.value = municipio.id;
                        option.textContent = municipio.nombre;
                        municipioSelect.appendChild(option);
                    });
                    
                    municipioSelect.disabled = false;
                })
                .catch(error => {
                    console.error('Error:', error);
                    municipioSelect.innerHTML = '<option value="">Error al cargar los datos</option>';
                })
                .finally(() => {
                    spinner.style.display = 'none';
                });
        });
    </script>

</body>
</html>
